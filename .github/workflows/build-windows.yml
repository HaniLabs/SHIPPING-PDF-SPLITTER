name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y
          $tesseractPath = "C:\Program Files\Tesseract-OCR"
          if (Test-Path $tesseractPath) {
            Add-Content $env:GITHUB_PATH $tesseractPath
          }

      - name: Install app and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build executable
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shipping-PDF-Splitter-Windows
          path: dist/Shipping PDF Splitter.exe

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/Shipping PDF Splitter.exe#Shipping PDF Splitter.exe" `
            --title "Shipping PDF Splitter $env:GITHUB_REF_NAME" `
            --generate-notes
