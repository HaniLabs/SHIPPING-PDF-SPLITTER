[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipping-pdf-splitter"
version = "0.2.0"
description = "Desktop app for splitting scanned shipping PDFs by shipping list number."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "rapidocr==3.9.2",
    "onnxruntime==1.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
shipping-pdf-splitter = "shipping_pdf_splitter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
